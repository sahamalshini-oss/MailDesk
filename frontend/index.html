* { box-sizing: border-box; }
html,body { margin: 0; height: 100%; background: linear-gradient(180deg, #edf5ff 0%, var(--bg) 180px, var(--bg) 100%); color: var(--ink); font: 14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--ac); text-decoration: none; }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 9px 14px; transition: 0.15s ease; }
button:hover { transform: translateY(-1px); }
button.p { background: linear-gradient(135deg, var(--ac) 0%, #3b82f6 100%); border-color: var(--ac); color: #fff; box-shadow: 0 10px 18px rgba(37,99,235,0.18); }
button.p:active { background: var(--ac2); }
button.secondary { background: #fff; border-color: var(--line); color: var(--ink); }
button.secondary:active { background: #f8fbff; }
button.danger { color: var(--ac); border-color: rgba(37,99,235,0.2); background: #fff; }
button.danger:hover { background: #f3f8ff; }
input, select, textarea { font: inherit; width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
input:focus, select:focus, textarea:focus { outline: var(--ring); border-color: var(--ac); }
label { display: block; font-size: 12px; color: var(--mut); margin-bottom: 6px; font-weight: 600; }
.err { color: var(--ac); font-size: 13px; margin-top: 6px; }
.ok { color: var(--ac); font-size: 13px; margin-top: 6px; }
.card { background: rgba(255,255,255,0.42); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); backdrop-filter: blur(2px); }
.modal-backdrop { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 20px; background: rgba(15,23,42,0.45); }
.modal-backdrop[hidden] { display: none; }
.app-modal { width: min(100%, 460px); padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: #fff; box-shadow: 0 24px 70px rgba(15,23,42,0.24); color: var(--ink); }
.app-modal h2 { margin: 0; font-size: 18px; }
.app-modal p { margin: 8px 0 14px; color: var(--mut); white-space: pre-wrap; }
.app-modal label { margin-top: 8px; }
.app-modal input, .app-modal textarea { margin-bottom: 4px; }
.app-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.app-modal button.danger { background: #2563eb; color: #fff; border-color: #2563eb; }
.g { display: grid; gap: 18px; grid-template-columns: 1.2fr 0.8fr; }
@media (max-width: 700px) { .g, .send-address-row { grid-template-columns: 1fr; } }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; }
th { color: var(--mut); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
tbody tr:hover { background: #f8fbff; }
.small { font-size: 12px; color: var(--mut); }
.muted { color: var(--mut); }
.badge { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #ecf4ff; color: var(--ac); border: 1px solid #d5e6ff; }
.badge.ok { background: #ecf4ff; color: var(--ac); border-color: #d5e6ff; }
.badge.bad { background: #f3f8ff; color: var(--ac); border-color: #d5e6ff; }
/* Layout */
.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 248px; background: linear-gradient(180deg, #0651a7 0%, #043d78 100%); color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar .brand { padding: 20px 20px 18px; font-size: 19px; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.18); }
.sidebar .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, #dbeafe 0%, #ffffff 100%); box-shadow: 0 0 0 4px rgba(255,255,255,0.12); }
.sidebar nav { flex: 1; overflow-y: auto; padding: 12px 12px 8px; }
.sidebar button { width: 100%; text-align: left; padding: 11px 14px; border: none; background: transparent; color: #dbeafe; border-radius: 10px; border-left: 3px solid transparent; transition: all 0.15s ease; font-size: 13.5px; font-weight: 600; }
.sidebar button.on { background: rgba(255,255,255,0.12); color: #fff; border-left-color: #ffffff; }
.sidebar button:hover:not(.on) { background: rgba(255,255,255,0.08); color: #fff; }
.sidebar .footer { padding: 16px 18px 20px; border-top: 1px solid rgba(255,255,255,0.12); }
.sidebar button.logout { margin-top: 10px; color: #dbeafe; border-left: 3px solid transparent; background: rgba(255,255,255,0.08); }
.sidebar button.logout:hover { background: rgba(255,255,255,0.14); color: #eff6ff; border-left-color: #ffffff; }
.main { flex: 1; overflow-y: auto; background: transparent; padding: 24px 30px 32px; position: relative; }
.main::before { content: ""; position: fixed; left: 248px; right: 0; top: 0; bottom: 0; margin: auto; width: min(420px, 38vw); height: min(420px, 38vw); background-image: var(--company-logo, none); background-position: center; background-repeat: no-repeat; background-size: contain; opacity: 0.16; pointer-events: none; z-index: 0; animation: company-logo-float 12s ease-in-out infinite; filter: drop-shadow(0 8px 24px rgba(0,0,0,0.08)); }
.main > * { position: relative; z-index: 1; }
@keyframes company-logo-float { 0%, 100% { transform: translateY(0) scale(1); opacity: 0.14; } 50% { transform: translateY(-12px) scale(1.04); opacity: 0.2; } }
.headerbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.headerbar h1 { font-size: 30px; margin: 0; letter-spacing: -0.8px; }
.headerbar .sub { color: var(--mut); font-size: 13px; margin-top: 4px; }
.company-picker { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.company-logo-btn { width: 72px; height: 48px; padding: 6px; border: 2px solid var(--line); border-radius: 10px; background: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.15s ease; }
.company-logo-btn:hover { transform: translateY(-1px); border-color: var(--ac); }
.company-logo-btn.on { border-color: var(--ac); box-shadow: var(--ring); }
.company-logo-btn img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.company-logo-fallback { font-size: 13px; font-weight: 800; color: var(--ac); line-height: 1; text-align: center; }
@keyframes logoPop {
  0% { transform: scale(1) rotate(0deg); }
  40% { transform: scale(1.2) rotate(-8deg); }
  70% { transform: scale(0.95) rotate(4deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.company-logo-btn.animating { animation: logoPop 0.7s cubic-bezier(.34,1.56,.64,1); }
.user-chip { font-size: 13px; color: var(--mut); background: rgba(255,255,255,0.8); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; }
.dashboard { display: flex; flex-direction: column; gap: 18px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; box-shadow: none; min-height: 0; }
.stat-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; color: var(--mut); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.stat-chip { width: 24px; height: 24px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); color: var(--ac); font-size: 13px; }
.stat-chip svg { display: block; width: 13px; height: 13px; }
.stat-value { font-size: 20px; line-height: 1.1; margin-top: 6px; font-weight: 800; letter-spacing: -0.04em; color: var(--ink); }
.stat-foot { margin-top: 2px; color: var(--mut); font-size: 11px; }
.stat-trend.up { color: var(--ac); }

function showDialog(title, text, okCancel) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-backdrop';
    overlay.innerHTML = `<div class="app-modal" role="dialog" aria-modal="true"><h2>${esc(title || '')}</h2>${text ? `<p>${esc(text)}</p>` : ''}<div class="app-modal-actions">${okCancel ? '<button class="secondary" data-cancel>Cancel</button>' : ''}<button class="p" data-ok>OK</button></div></div>`;
    const close = v => { overlay.remove(); resolve(v); };
    overlay.querySelector('[data-ok]').onclick = () => close(true);
    const cancel = overlay.querySelector('[data-cancel]');
    if (cancel) cancel.onclick = () => close(false);
    overlay.onclick = e => { if (e.target === overlay) close(!!cancel ? false : true); };
    document.body.appendChild(overlay);
    overlay.querySelector('[data-ok]').focus();
  });
}

function showFormDialog(title, fields) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-backdrop';
    const body = fields.map(f => `<label for="dlg-${f.name}">${esc(f.label)}</label>${f.type === 'textarea' ? `<textarea id="dlg-${f.name}" rows="3" placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea>` : `<input id="dlg-${f.name}" type="${f.type||'text'}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}">`}`).join('');
    overlay.innerHTML = `<div class="app-modal" role="dialog" aria-modal="true"><h2>${esc(title||'')}</h2><div>${body}</div><div class="app-modal-actions"><button class="secondary" data-cancel>Cancel</button><button class="p" data-ok>OK</button></div></div>`;
    const close = v => { overlay.remove(); resolve(v); };
    overlay.querySelector('[data-ok]').onclick = () => {
      const out = {};
      fields.forEach(f => { out[f.name] = (overlay.querySelector('#dlg-' + f.name) || {}).value ?? ''; });
      close(out);
    };
    overlay.querySelector('[data-cancel]').onclick = () => close(null);
    overlay.onclick = e => { if (e.target === overlay) close(null); };
    document.body.appendChild(overlay);
    const first = overlay.querySelector('input,textarea,button'); if (first) first.focus();
  });
}

let followUpTimer;
async function checkFollowUpReminders() {
  if (!T) return;
  try {
    const items = await api('/api/sent');
    const now = Date.now();
    const due = items.find(x => x.follow_up_at && !x.replied_at && !x.follow_up_done_at && !localStorage['fu_seen_' + x.id + '_' + x.follow_up_at] && !Number.isNaN(new Date(x.follow_up_at).getTime()) && new Date(x.follow_up_at).getTime() <= now);
    if (!due) return;
    localStorage['fu_seen_' + due.id + '_' + due.follow_up_at] = '1';
    const msg = `To: ${due.to_list || ''}\nSubject: ${due.subject || ''}\nDue: ${String(due.follow_up_at).replace('T', ' ')}${due.follow_up_note ? '\nNote: ' + due.follow_up_note : ''}`;
    const open = await showDialog('Follow-up reminder', msg + '\n\nOpen Tracking to manage this follow-up?', true);
    if (open) go('trk');
  } catch {}
}
function startFollowUpReminders() {
  if (followUpTimer) clearInterval(followUpTimer);
  if (!T) return;
  checkFollowUpReminders();
  followUpTimer = setInterval(checkFollowUpReminders, 30000);
}

    const signature = $('#sfld-signature');
    const sender = ss.find(item => String(item.id) === $('#s').value);
    if (signature && signature.dataset.autofilled === 'sender') signature.value = sender?.from_name || '';
    sendRenderPreview();
  };
  quill.on('text-change', sendRenderPreview);
  prev();
  if (savedDraft) {
    const values = savedDraft.values || {};
    $('#sj').value = savedDraft.subject || '';
    quill.root.innerHTML = savedDraft.draft_html || '';
    $('#send-title').value = values.title || '';
    $('#send-company-name').value = values.company_name ?? sessionStorage.cname ?? '';
    document.querySelectorAll('#tflds [data-fld]').forEach(field => { if (values[field.dataset.fld] !== undefined) field.value = values[field.dataset.fld]; });
    $('#cc').value = savedDraft.cc_list || '';
    $('#sch').value = savedDraft.scheduled_at || '';
    $('#followAt').value = savedDraft.follow_up_at || '';
    $('#followNote').value = savedDraft.follow_up_note || '';
    sendRenderPreview();
  }
  sessionStorage.removeItem('composeTemplateId');
  // attachments
  const atchInput = $('#atch');
  const atchList = $('#atchList');
  atchInput.onchange = async () => {
    const files = [...atchInput.files];
    if (!files.length) return;
    const fd = new FormData();
    for (const f of files) fd.append('files', f);
    try {
      const r = await fetch('/api/attachments/upload', { headers: { Authorization: 'Bearer ' + T }, body: fd, method: 'POST' });
      const j = await r.json();
      if (!r.ok) throw Error(j.error || 'Upload failed');
      attachmentItems.push(...j.attachments);
      attachmentIds = attachmentItems.map(a => a.id);
      renderAtch();
      atchList.onclick = ev => { const id = Number(ev.target.dataset.atch); if (id) { attachmentItems = attachmentItems.filter(item => item.id !== id); attachmentIds = attachmentItems.map(item => item.id); renderAtch(); } };
      atchInput.value = '';
    } catch (e) { $('#msg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  };
  const renderAtch = () => { atchList.innerHTML = attachmentItems.map(a => `<span class="recipient-pill">📎 ${esc(a.original_name)} <span class="x" data-atch="${a.id}">×</span></span>`).join(''); };
  renderAtch();
  const getHtml = () => getEditorHtml(quill);
  const validEmail = email => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const syncRecipientFields = () => {
    const contact = recipientPills.length === 1 ? contactsList.find(item => item.email.toLowerCase() === recipientPills[0].toLowerCase()) : null;
    const defaults = { first_name: contact?.name?.trim().split(/\s+/)[0] || '', client_name: contact?.name?.trim() || '' };
    for (const [key, value] of Object.entries(defaults)) {
      const field = $(`#sfld-${key}`);
      if (!field) continue;
      if (field.dataset.autofilled === 'contact') field.value = value;
      else if (value && !field.value.trim()) { field.value = value; field.dataset.autofilled = 'contact'; }
      if (!value) delete field.dataset.autofilled;
    }
    sendRenderPreview();
  };
  const addPill = (email) => {
    if (!email || !validEmail(email)) return;
    if (recipientPills.includes(email)) return;
    recipientPills.push(email);
    renderPills();
    syncRecipientFields();
  };
  const renderPills = () => {
    $('#rpills').innerHTML = recipientPills.map(e => `<span class="recipient-pill">${esc(e)} <span class="x" data-rem="${e}">×</span></span>`).join('');
    $('#rpills').onclick = ev => { const rem = ev.target.dataset.rem; if (rem) { recipientPills = recipientPills.filter(x => x !== rem); renderPills(); syncRecipientFields(); } };
  };
  renderPills();
  $('#radd').onclick = () => { const v = $('#rto').value.trim(); if (v) { addPill(v); $('#rto').value = ''; } };
  $('#rto').onkeypress = ev => { if (ev.key === 'Enter') { $('#radd').click(); } };
  $('#schClear').onclick = () => { $('#sch').value = ''; };
  $('#followClear').onclick = () => { $('#followAt').value = ''; };
  $('#phIns').onclick = () => { const v = $('#ph').value; if (v && quill) { quill.insertText(quill.getSelection()?.index || quill.getLength(), v); quill.focus(); } };
  const dragTo = sessionStorage.dragTo;
  if (dragTo) { sessionStorage.removeItem('dragTo'); addPill(dragTo); }
  const doSend = async (isDraft) => {
    const to = recipientPills;
    if (!isDraft && !ss.some(sender => String(sender.id) === $('#s').value)) return $('#msg').innerHTML = `<span class="err">No sender is configured for this company. Add a sender in the Senders tab before sending.</span>`;
    if (!isDraft && !to.length) return $('#msg').innerHTML = `<span class="err">Add at least one recipient</span>`;
    const cc = $('#cc').value.split(/[;,\s]+/).filter(Boolean);
    if (!isDraft && cc.some(email => !validEmail(email))) return $('#msg').innerHTML = `<span class="err">Check the CC email addresses</span>`;
    const values = getValues();
    const rawSubject = $('#sj').value;
    const rawHtml = getHtml();
    const subject = replaceText(rawSubject, values);
    const html = replaceHtml(rawHtml, values);
    if (!isDraft && !html.trim()) return $('#msg').innerHTML = `<span class="err">Email body is required</span>`;
    $('#msg').textContent = isDraft ? 'Saving draft…' : 'Sending…';
    try {
      const sch = $('#sch').value || null;
      const follow_up_at = $('#followAt').value || null;
      const follow_up_note = $('#followNote').value.trim() || null;
      if (isDraft) {
        const body = { template_id: $('#t').value ? +$('#t').value : null, sender_id: $('#s').value || null, values, to, cc, scheduled_at: sch, follow_up_at, follow_up_note, subject: rawSubject, html: rawHtml, attachment_ids: attachmentIds };
        const id = sessionStorage.editDraftId;
        if (id) await api('/api/drafts/' + id, { m: 'PUT', b: body });
        else await api('/api/send', { b: { ...body, draft: 1 } });
        sessionStorage.removeItem('editDraftId');
        await showDialog('Draft saved', 'Your email is saved and available in the Drafts tab.');
        go('drafts');
        return;
      }
      const r = await api('/api/send', { b: { template_id: $('#t').value ? +$('#t').value : null, sender_id: $('#s').value || null, values, to, cc, draft: 0, scheduled_at: sch, follow_up_at, follow_up_note, subject, html, attachment_ids: attachmentIds } });
      const draftId = sessionStorage.editDraftId;
      if (draftId && r.status === 'sent') { await api('/api/drafts/' + draftId, { m: 'DELETE' }); sessionStorage.removeItem('editDraftId'); }
      $('#msg').innerHTML = `<span class="ok">${isDraft ? 'Draft saved' : 'Email sent'} (${r.status})</span>`;
      recipientPills = []; renderPills();
    } catch (e) { $('#msg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  };
  const htmlToText = html => {
    const d = document.createElement('div');
    d.innerHTML = String(html || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li|h\d|tr)>/gi, '\n');
    d.querySelectorAll('li').forEach(li => li.prepend('• '));
    return (d.textContent || '').replace(/\u00a0/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  };
  const openInOutlook = async () => {
    const to = recipientPills.join(';');
    const cc = $('#cc').value.split(/[;,\s]+/).filter(Boolean).join(';');
    const values = getValues();
    const subject = replaceText($('#sj').value || '', values);
    const html = replaceHtml(getHtml() || '', values);
    const body = htmlToText(html);
    const params = new URLSearchParams();
    if (to) params.set('to', to);
    if (cc) params.set('cc', cc);
    if (subject) params.set('subject', subject);
    if (body) params.set('body', body);
    const webUrl = 'https://outlook.office.com/mail/deeplink/compose?' + params.toString();
    const mailto = 'mailto:' + encodeURIComponent(to) + '?' + new URLSearchParams({ ...(cc ? { cc } : {}), ...(subject ? { subject } : {}), ...(body ? { body } : {}) }).toString();
    const proceed = await showDialog('Open in Outlook', 'This will open your message in Outlook so you can choose/edit the sending mailbox and send from there. Attachments cannot be transferred automatically and must be added in Outlook. Continue?', true);
    if (!proceed) return;
    const win = window.open(webUrl, '_blank', 'noopener,noreferrer');
    if (!win) location.href = mailto;
    $('#msg').innerHTML = '<span class="ok">Opened in Outlook. Review the sender/mailbox, add attachments if needed, then send from Outlook.</span>';
  };
  $('#sd').onclick = () => doSend(false);
  $('#sdOutlook').onclick = openInOutlook;
  $('#svDraft').onclick = () => doSend(true);
}

// ---------- TEMPLATES ----------
async function tpl() {
  const ts = await api('/api/templates');
  const coName = sessionStorage.cname || '';
  $('#m').innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;">
        <div>
          <h3 style="margin:0 0 2px 0;font-size:17px">Templates</h3>
          <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em">Company: ${esc(coName || '—')}</div>
        </div>
        ${R === 'super' ? `<span style="font-size:11px;background:#eef4ff;border:1px solid #d5e6ff;padding:2px 8px;border-radius:8px;color:var(--ac)">Switch company above</span>` : ''}
      </div>
      <div class="template-grid">${ts.map(t => `<article class="template-card"><h4>${esc(t.name)}</h4><div class="template-subject">${esc(t.subject)}</div><div class="template-fields">${t.fields ? t.fields.map(f => `<span class="template-field">{{${f.key}}}</span>`).join('') : ''}</div><div class="template-actions"><button class="p" data-use="${t.id}">Use in email</button><button class="secondary" data-e="${t.id}">Edit</button> <button class="danger" data-d="${t.id}">Delete</button></div></article>`).join('')}</div>
      ${ts.length ? '' : '<p class="empty">No templates yet.</p>'}
    </div>
    <div class="card template-form">
      <h3 style="margin:0 0 12px 0;font-size:17px">Create template</h3>
      <label>Name</label><input id="tn"><label>Subject</label><input id="tsj" placeholder="Hello {{first_name}}">
      <div class="merge-tools">
        <label for="merge-key">Placeholder</label>
        <select id="merge-key"><option value="first_name">first_name</option><option value="title">title</option><option value="client_name">client_name</option><option value="company_name">company_name</option><option value="vessel_name">vessel_name</option><option value="signature">signature</option><option value="invoice_no">invoice_no</option><option value="due_date">due_date</option><option value="priority">priority</option></select>
        <button class="secondary" id="insert-subject" type="button">Insert in subject</button>
        <button class="secondary" id="insert-body" type="button">Insert in body</button>
      </div>
      <p class="small">Placeholders in the subject or body become fill-in fields when the template is selected in Compose.</p>
      <label>HTML content</label><div id="teditor"></div>
      <div class="template-spacing">
        <label>Line spacing<select id="tpl-line-spacing"><option value="1">1.0</option><option value="1.15">1.15</option><option value="1.3">1.3</option><option value="1.5" selected>1.5</option><option value="1.75">1.75</option><option value="2">2.0</option></select></label>
        <label>Paragraph spacing<select id="tpl-paragraph-spacing"><option value="0">None</option><option value="4">4px</option><option value="8" selected>8px</option><option value="12">12px</option><option value="16">16px</option><option value="24">24px</option></select></label>
      </div>
      <label>Or upload HTML file</label><input type="file" id="tfup" accept=".html,.htm">
      <p id="tfmsg" class="err"></p>
      <label style="margin-top:8px">Fields detected from subject and body</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center" id="tfields"></div>
      <div id="tfvals" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;"></div>
      <div class="card preview-card" style="margin-top:14px;padding:14px;border-radius:12px;background:#f8fbff;border:1px solid #d5e6ff;">
        <div style="font-size:11px;color:#4f6fa8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Preview</div>
        <div id="tpj" style="font-size:17px;font-weight:800;margin-bottom:10px"></div>
        <div id="tpb" style="font-size:13px;line-height:1.5;color:#0f172a"></div>
      </div>
      <p id="tmsg" class="err"></p><button class="p" id="tsv">Save template</button>
    </div>`;
  let tquill = new Quill('#teditor', { theme: 'snow', placeholder: 'Template body…', modules: { toolbar: templateToolbar } });
  let savedSchema = [];
  const escId = s => String(s).replace(/[^a-z0-9]/gi, '_');
  const tplKeys = () => [...new Set([...(tquill.root.innerHTML + $('#tsj').value).matchAll(/{{\s*(\w+)\s*}}/g)].map(m => m[1]))];
  const fieldLabel = key => key.replace(/_/g, ' ').replace(/\b\w/g, char => char.toUpperCase());
  const tplSchema = () => tplKeys().map(key => {
    const saved = savedSchema.find(field => field.key === key);
    const type = key === 'title' ? 'select' : key === 'due_date' ? 'date' : (saved?.type || 'text');
    const options = key === 'title' ? ['Mr', 'Mrs', 'Ms', 'Sir', 'Madam'] : saved?.options;
    return { key, label: saved?.label || fieldLabel(key), type, ...(options ? { options } : {}) };
  });
  const tplRenderFields = () => {
    const fields = tplSchema();
    $('#tfields').innerHTML = fields.length ? fields.map(field => `<span class="template-field">{{${esc(field.key)}}}</span>`).join('') : '<span class="small">No placeholders detected yet</span>';
  };
  const tplRenderVals = () => {
    const previous = Object.fromEntries([...document.querySelectorAll('#tfvals [data-preview-field]')].map(el => [el.dataset.previewField, el.value]));
    const keys = tplKeys();
    $('#tfvals').innerHTML = keys.map(key => `<label style="font-size:11px;display:flex;align-items:center;gap:6px;white-space:nowrap">${esc(fieldLabel(key))}${key === 'title' ? `<select data-preview-field="title"><option value="">Select</option>${['Mr', 'Mrs', 'Ms', 'Sir', 'Madam'].map(title => `<option value="${title}" ${previous[key] === title ? 'selected' : ''}>${title}</option>`).join('')}</select>` : `<input type="${key === 'due_date' ? 'date' : 'text'}" data-preview-field="${esc(key)}" style="width:130px;padding:4px 8px;border:1px solid #d5e6ff;border-radius:8px;font:inherit;" value="${esc(previous[key] || '')}">`}</label>`).join('');
    keys.forEach(key => { const el = document.querySelector(`#tfvals [data-preview-field="${key}"]`); if (el) { el.oninput = tplRenderPreview; el.onchange = tplRenderPreview; } });
  };
  const tplRenderPreview = () => {
    const vals = Object.fromEntries([...document.querySelectorAll('#tfvals [data-preview-field]')].map(el => [el.dataset.previewField, el.value]));
    const fill = text => text.replace(/{{\s*(\w+)\s*}}/g, (_, key) => esc(vals[key] ?? ''));
    $('#tpj').textContent = fill($('#tsj').value) || '(no subject)';
    $('#tpb').innerHTML = fill(getEditorHtml(tquill)) || '(empty)';
  };
  const tplRefresh = () => { tplRenderFields(); tplRenderVals(); tplRenderPreview(); };
  const spacingBlocks = 'p,h1,h2,h3,h4,h5,h6,li,blockquote,pre';
  const applySpacing = () => {
    tquill.root.querySelectorAll(spacingBlocks).forEach(block => {
      block.style.lineHeight = $('#tpl-line-spacing').value;
      block.style.marginBottom = `${$('#tpl-paragraph-spacing').value}px`;
    });
    tplRefresh();
  };
  const readSpacing = () => {
    const block = tquill.root.querySelector(spacingBlocks);
    if (!block) return;
    const lineSpacing = Number.parseFloat(block.style.lineHeight);
    const paragraphSpacing = Number.parseFloat(block.style.marginBottom);
    if (Number.isFinite(lineSpacing) && $('#tpl-line-spacing').querySelector(`option[value="${lineSpacing}"]`)) $('#tpl-line-spacing').value = String(lineSpacing);
    if (Number.isFinite(paragraphSpacing) && $('#tpl-paragraph-spacing').querySelector(`option[value="${paragraphSpacing}"]`)) $('#tpl-paragraph-spacing').value = String(paragraphSpacing);
  };
  $('#tpl-line-spacing').onchange = applySpacing;
  $('#tpl-paragraph-spacing').onchange = applySpacing;
  $('#tfup').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const html = await f.text();
    if (!$('#tn').value.trim()) $('#tn').value = f.name.replace(/\.html?$/i, '').replace(/[-_]+/g, ' ').trim();
    tquill.root.innerHTML = html;
    readSpacing(); applySpacing();
    $('#tfmsg').innerHTML = `<span class="ok">${html.length} bytes loaded, ${tplKeys().length} merge field(s) detected</span>`;
  };
  $('#insert-subject').onclick = () => {
    const subject = $('#tsj'), token = `{{${$('#merge-key').value}}}`;
    const start = subject.selectionStart ?? subject.value.length;
    const end = subject.selectionEnd ?? start;
    subject.value = subject.value.slice(0, start) + token + subject.value.slice(end);
    subject.focus(); subject.setSelectionRange(start + token.length, start + token.length); tplRefresh();
  };
  $('#insert-body').onclick = () => {
    const token = `{{${$('#merge-key').value}}}`;
    const range = tquill.getSelection(true);
    tquill.insertText(range?.index ?? Math.max(0, tquill.getLength() - 1), token);
    tquill.focus();
  };
  $('#tsj').oninput = tplRefresh;
  tquill.on('text-change', applySpacing);
  $('#m').onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.use) { sessionStorage.composeTemplateId = b.dataset.use; go('send'); return; }
    if (b.dataset.d) { if (await showDialog('Delete template?', 'This permanently deletes the template.', true)) { await api('/api/templates/' + b.dataset.d, { m: 'DELETE' }); tpl(); } }
    if (b.dataset.e) {
      const t = ts.find(x => x.id == b.dataset.e);
      $('#tn').value = t.name; $('#tsj').value = t.subject; savedSchema = t.fields || [];
      tquill.root.innerHTML = t.html || '';
      readSpacing(); applySpacing();
      $('#tsv').textContent = 'Update template';
      $('#tsv').dataset.upd = t.id;
    }
  };
  $('#tsv').onclick = async () => {
    const id = $('#tsv').dataset.upd;
    const fields = tplSchema();
    const body = { name: $('#tn').value, subject: $('#tsj').value, html: getEditorHtml(tquill), fields };
    try {
      if (id) { await api('/api/templates/' + id, { m: 'PUT', b: body }); delete $('#tsv').dataset.upd; $('#tsv').textContent = 'Save template'; }
      else await api('/api/templates', { b: body });
      tpl();
    } catch (e) { $('#tmsg').textContent = e.message; }
  };
}

          <h3 style="margin:0 0 12px 0;font-size:17px">Import contacts</h3>
          <p class="small">CSV columns: email, name, category, status</p>
          <input type="file" id="cfile" accept=".csv"><p id="cimsg" class="err"></p><button class="p" id="cimport">Import CSV</button>
        </section>
      </div>
    </div>`;
  $('#contact-search').oninput = e => {
    const query = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.contact-item-card').forEach(card => { card.hidden = !card.dataset.search.includes(query); });
  };
  $('#csv').onclick = async () => {
    try { await api('/api/contacts', { b: { email: $('#ce').value, name: $('#cn').value, category: $('#ccat').value, status: $('#cst').value } }); cts(); } catch (e) { $('#cmsg').textContent = e.message; }
  };
  $('#cimport').onclick = async () => {
    const f = $('#cfile').files[0]; if (!f) return;
    const text = await f.text();
    Papa.parse(text, { header: true, skipEmptyLines: true, complete: res => {
      const contacts = res.data.filter(r => r.email).map(r => ({ email: r.email, name: r.name || '', category: r.category || '', status: r.status || 'active' }));
      api('/api/contacts/import', { b: { contacts } }).then(r => { $('#cimsg').innerHTML = `<span class="ok">${r.inserted} contact(s) imported</span>`; cts(); }).catch(e => { $('#cimsg').textContent = e.message; });
    }});
  };
  $('#m').onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.recipientView) { sessionStorage.recipientSection = b.dataset.recipientView; return b.dataset.recipientView === 'groups' ? grp() : cts(); }
    if (b.dataset.d) { if (await showDialog('Delete contact?', 'This permanently deletes the contact.', true)) { await api('/api/contacts/' + b.dataset.d, { m: 'DELETE' }); cts(); } }
    if (b.dataset.e) {
      const c = contactsList.find(x => x.id == b.dataset.e);
      $('#ce').value = c.email; $('#cn').value = c.name || ''; $('#ccat').value = c.category || ''; $('#cst').value = c.status || 'active';
      $('#csv').textContent = 'Update contact';
      $('#csv').dataset.upd = c.id;
    }
  };
  const origCsv = $('#csv').onclick;
  $('#csv').onclick = async () => {
    const id = $('#csv').dataset.upd;
    if (id) {
      try { await api('/api/contacts/' + id, { m: 'PUT', b: { email: $('#ce').value, name: $('#cn').value, category: $('#ccat').value, status: $('#cst').value } }); delete $('#csv').dataset.upd; $('#csv').textContent = 'Add contact'; cts(); } catch (e) { $('#cmsg').textContent = e.message; }
    } else { origCsv(); }
  };
}

// ---------- GROUPS ----------
async function grp() {
  const gs = await api('/api/contact-groups');
  const groups = await Promise.all(gs.map(async group => ({ ...group, members: await api(`/api/contact-groups/${group.id}/members`) })));
  $('#m').innerHTML = `
    <div class="groups-page">
      ${recipientSubnav('groups')}
      <section class="groups-directory">
        <div class="contacts-heading"><div><h3>Recipient groups</h3><span class="small">${groups.length} ${groups.length === 1 ? 'group' : 'groups'}</span></div></div>
        ${groups.length ? `<div class="groups-grid">${groups.map(group => `<article class="group-card">
          <div class="group-card-header"><div><h4>${esc(group.name)}</h4><span class="small">Group #${group.id}</span></div><span class="group-count">${group.members.length} members</span></div>
          ${group.members.length ? `<ul class="group-member-list">${group.members.map(member => `<li><div class="group-member-info"><strong>${esc(member.name || member.email)}</strong><span>${esc(member.email)}</span></div><button class="danger group-member-remove" aria-label="Remove ${esc(member.email)}" data-rm="${member.id}" data-g="${group.id}">Remove</button></li>`).join('')}</ul>` : '<div class="group-empty">No members in this group yet.</div>'}
          <form class="group-add-form" data-group-add="${group.id}"><input type="email" data-group-email placeholder="Add member email" aria-label="Email to add to ${esc(group.name)}" required><button class="p" type="submit">Add</button></form>
          <div class="group-card-actions"><button class="secondary" data-e="${group.id}">Rename</button><button class="danger" data-d="${group.id}">Delete group</button></div>
        </article>`).join('')}</div>` : '<p class="empty">No groups yet.</p>'}
      </section>
      <section class="card">
        <h3 style="margin:0 0 12px 0;font-size:17px">Create group</h3>
        <label for="gn">Group name</label><input id="gn"><p id="gmsg" class="err"></p><button class="p" id="gsv">Save group</button>
      </section>
    </div>`;
  $('#gsv').onclick = async () => { try { await api('/api/contact-groups', { b: { name: $('#gn').value } }); grp(); } catch (e) { $('#gmsg').textContent = e.message; } };
  $('#m').onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.recipientView) { sessionStorage.recipientSection = b.dataset.recipientView; return b.dataset.recipientView === 'groups' ? grp() : cts(); }
    if (b.dataset.d) { if (await showDialog('Delete group?', 'This permanently deletes the group.', true)) { await api('/api/contact-groups/' + b.dataset.d, { m: 'DELETE' }); grp(); } }
    if (b.dataset.e) { const g = gs.find(x => x.id == b.dataset.e); $('#gn').value = g.name; $('#gsv').textContent = 'Update group'; $('#gsv').dataset.upd = g.id; }
    if (b.dataset.rm) { await api(`/api/contact-groups/${b.dataset.g}/members/${b.dataset.rm}`, { m: 'DELETE' }); await grp(); }
  };
  const origGsv = $('#gsv').onclick;
  $('#gsv').onclick = async () => {
    const id = $('#gsv').dataset.upd;
    if (id) { try { await api('/api/contact-groups/' + id, { m: 'PUT', b: { name: $('#gn').value } }); delete $('#gsv').dataset.upd; $('#gsv').textContent = 'Save group'; grp(); } catch (e) { $('#gmsg').textContent = e.message; } } else { origGsv(); }
  };
  $('#m').onsubmit = async e => {
    if (!e.target.matches('[data-group-add]')) return;
    e.preventDefault();
    const gid = e.target.dataset.groupAdd, email = e.target.querySelector('[data-group-email]').value.trim();
    try {
      let contact = (await api('/api/contacts')).find(item => item.email.toLowerCase() === email.toLowerCase());
      if (!contact) {
        await api('/api/contacts', { b: { email, name: '', category: '', status: 'active' } });
        contact = (await api('/api/contacts')).find(item => item.email.toLowerCase() === email.toLowerCase());
      }
      await api(`/api/contact-groups/${gid}/members`, { b: { contactIds: [contact.id] } });
      await grp();
    } catch (error) { await showDialog('Could not add group member', error.message); }
  };
}

// ---------- COMPANIES ----------
async function co() {
  const cs = await api('/api/companies');
  const totalSent = cs.reduce((sum, c) => sum + (Number(c.sent_count) || 0), 0);
  let angle = 0;
  const slices = cs.map((c, i) => {
    const sent = Number(c.sent_count) || 0;
    const start = angle;
    angle += totalSent ? sent / totalSent * 360 : 0;
    const colors = ['#113065', '#15803d', '#000080', '#7c3aed', '#e11d48', '#0891b2', '#f59e0b', '#84cc16'];
    return { ...c, sent, start, end: angle, color: colors[i % colors.length], share: totalSent ? Math.round(sent / totalSent * 100) : 0 };
  });
  const chartBg = totalSent ? `conic-gradient(${slices.map(s => `${s.color} ${s.start}deg ${s.end}deg`).join(',')})` : 'conic-gradient(#dbeafe 0deg 360deg)';
  $('#m').innerHTML = `
    <div class="card">
      <h3 style="margin:0 0 12px 0;font-size:17px">Sent email distribution by company</h3>
      <div class="company-chart-layout">
        <div class="company-donut" role="img" aria-label="${totalSent} sent emails among ${cs.length} companies" style="background:${chartBg}">
          <div class="company-donut-center"><strong>${totalSent}</strong><span>Total sent</span></div>
        </div>
        <ul class="company-chart-legend">${slices.map(s => `<li><div class="company-chart-label"><span class="company-chart-swatch" style="background:${s.color}"></span><span>${esc(s.name)}</span></div><span class="company-chart-value">${s.sent} · ${s.share}%</span></li>`).join('')}</ul>
      </div>
    </div>
    <div class="card">
      <h3 style="margin:0 0 12px 0;font-size:17px">Companies</h3>
      <div class="company-grid">${cs.map(c => `<article class="company-card">
        <div class="company-card-top"><div><h4>${esc(c.name)}</h4><span class="small">Company #${c.id}</span></div></div>
        <div class="company-card-sent"><span class="stat-chip" style="width:24px;height:24px;font-size:12px">${Number(c.sent_count || 0)}</span><span>emails sent</span></div>
        <div class="company-card-actions"><button class="secondary" data-e="${c.id}">Edit</button> <button class="danger" data-d="${c.id}">Delete</button></div>
        <form class="company-edit" data-edit-form="${c.id}" hidden><label>Company name</label><input data-name value="${esc(c.name)}"><div class="company-card-actions"><button class="p" type="submit">Save</button><button class="secondary" type="button" data-cancel>Cancel</button></div></form>
      </article>`).join('')}</div>
      ${cs.length ? '' : '<p class="empty">No companies.</p>'}
      <label>New company</label><input id="n" maxlength="120"><p id="company-msg" class="err"></p><button class="p" id="ad">Add company</button>
    </div>`;
  $('#ad').onclick = async () => { try { await api('/api/companies', { b: { name: $('#n').value } }); await co(); await refreshCompanyPicker(); } catch (e) { $('#company-msg').textContent = e.message; } };
  $('#m').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.edit) { $(`[data-edit-form="${b.dataset.edit}"]`).hidden = false; return; }
    if (b.hasAttribute('data-cancel')) { b.closest('form').hidden = true; return; }
    if (b.dataset.d) { if (await showDialog('Delete company?', 'This permanently deletes the company and all its data.', true)) { await api('/api/companies/' + b.dataset.d, { m: 'DELETE' }); await co(); await refreshCompanyPicker(); } }
    if (b.dataset.e) { const c = cs.find(x => x.id == b.dataset.e); $('#n').value = c.name; $('#ad').textContent = 'Update company'; $('#ad').dataset.upd = c.id; }
  };
  $('#m').onsubmit = async e => {
    if (!e.target.matches('[data-edit-form]')) return;
    e.preventDefault();
    try { await api('/api/companies/' + e.target.dataset.editForm, { m: 'PUT', b: { name: e.target.querySelector('[data-name]').value } }); await co(); await refreshCompanyPicker(); } catch (e) { await showDialog('Could not update company', e.message); }
  };
}

// ---------- DRAFTS ----------
async function drafts() {
  const items = await api('/api/drafts');
  $('#m').innerHTML = `
    <div class="card">
      <h3 style="margin:0 0 12px 0;font-size:17px">Drafts</h3>
      <table>
        <thead><tr><th>Saved<th>To<th>CC<th>Subject<th></th></tr></thead>
        <tbody>${items.map(item => `<tr><td>${esc(item.at)}<td>${esc(item.to_list || '—')}<td>${esc(item.cc_list || '—')}<td>${esc(item.subject || '(no subject)')}<td><button class="secondary" data-open-draft="${item.id}">Edit</button> <button class="danger" data-delete-draft="${item.id}">Delete</button></tr>`).join('')}</tbody>
      </table>
      ${items.length ? '' : '<p class="empty">No saved drafts yet.</p>'}
    </div>`;
  $('#m').onclick = async event => {
    const button = event.target.closest('button'); if (!button) return;
    if (button.dataset.openDraft) { sessionStorage.editDraftId = button.dataset.openDraft; go('send'); return; }
    if (button.dataset.deleteDraft && await showDialog('Delete draft?', 'This permanently deletes the saved draft and its attachments.', true)) {
      try { await api('/api/drafts/' + button.dataset.deleteDraft, { m: 'DELETE' }); await drafts(); }
      catch (error) { await showDialog('Could not delete draft', error.message); }
    }
  };
}

// ---------- SENT LOG ----------
async function log() {
  const l = (await api('/api/sent')).filter(item => item.status !== 'draft');
  const now = Date.now();
  const followBadge = x => {
    if (x.replied_at) return '<span class="badge ok">Replied</span>';
    if (x.follow_up_done_at) return '<span class="badge follow-done">Follow-up done</span>';
    if (!x.follow_up_at) return '<span class="badge">No follow-up</span>';
    const due = new Date(x.follow_up_at).getTime();
    if (!Number.isNaN(due) && due < now) return `<span class="badge follow-overdue">Overdue ${esc(x.follow_up_at.replace('T',' '))}</span>`;
    return `<span class="badge follow-due">Due ${esc(x.follow_up_at.replace('T',' '))}</span>`;
  };
  $('#m').innerHTML = `
    <div class="card">
      <h3 style="margin:0 0 12px 0;font-size:17px">Sent log & follow-ups</h3>
      <table>
        <thead><tr><th>When<th>To<th>Subject<th>Status<th>Tracking<th>Follow-up<th>Actions</th></thead>
        <tbody>${l.map(x => `<tr>
          <td>${esc(x.at)}<td>${esc(x.to_list)}<td>${esc(x.subject)}
          <td><span class="badge ${x.status === 'sent' ? 'ok' : x.status === 'failed' ? 'bad' : 'ok'}">${esc(x.status)}</span>
          <td>${x.opens || 0} opens · ${x.clicks || 0} clicks · ${x.replies || 0} replies${x.replied_at ? `<div class="small">Replied: ${esc(String(x.replied_at).replace('T',' ').slice(0,16))}</div>` : ''}
          <td>${followBadge(x)}${x.follow_up_note ? `<div class="small">${esc(x.follow_up_note)}</div>` : ''}
          <td><div class="follow-actions"><button class="secondary" data-follow="${x.id}" data-at="${esc(x.follow_up_at||'')}" data-note="${esc(x.follow_up_note||'')}">Set follow-up</button><button class="secondary" data-reply="${x.id}">Mark replied</button>${x.follow_up_at && !x.follow_up_done_at && !x.replied_at ? `<button data-done="${x.id}">Done</button>` : ''}</div>
        </tr>`).join('')}</tbody>
      </table>
      ${l.length ? '' : '<p class="empty">No sent emails.</p>'}
    </div>`;
  $('#m').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.follow) {
        const form = await showFormDialog('Set follow-up', [
          { name: 'at', label: 'Follow-up date/time', type: 'datetime-local', value: b.dataset.at || '' },
          { name: 'note', label: 'Follow-up note (optional)', type: 'text', value: b.dataset.note || '' }
        ]);
        if (!form) return;
        await api('/api/campaign-recipients/' + b.dataset.follow + '/follow-up', { m: 'PUT', b: { follow_up_at: (form.at || '').trim() || null, follow_up_note: (form.note || '').trim(), clear_done: !(form.at || '').trim() } });
        return log();
      }
      if (b.dataset.done) { await api('/api/campaign-recipients/' + b.dataset.done + '/follow-up', { m: 'PUT', b: { done: 1 } }); return log(); }
      if (b.dataset.reply) {
        const form = await showFormDialog('Mark replied', [
          { name: 'note', label: 'Reply note (optional)', type: 'text', value: '' }
        ]);
        if (!form) return;
        await api('/api/campaign-recipients/' + b.dataset.reply + '/reply', { b: { note: (form.note || '').trim() } });
        return log();
      }
    } catch (err) { await showDialog('Could not update follow-up', err.message); }
  };
}

// ---------- TRACKING ----------
async function trk() {
  const l = await api('/api/sent');
  $('#m').innerHTML = `
    <div class="card">
      <h3 style="margin:0 0 12px 0;font-size:17px">Tracking, replies & follow-ups</h3>
      <table>
        <thead><tr><th>When<th>To<th>Subject<th>Events<th>Follow-up<th>Actions</th></thead>
        <tbody id="trk-body"></tbody>
      </table>
    </div>`;
  $('#m').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.follow) {
        const form = await showFormDialog('Set follow-up', [
          { name: 'at', label: 'Follow-up date/time', type: 'datetime-local', value: b.dataset.at || '' },
          { name: 'note', label: 'Follow-up note (optional)', type: 'text', value: b.dataset.note || '' }
        ]);
        if (!form) return;
        await api('/api/campaign-recipients/' + b.dataset.follow + '/follow-up', { m: 'PUT', b: { follow_up_at: (form.at || '').trim() || null, follow_up_note: (form.note || '').trim(), clear_done: !(form.at || '').trim() } });
        return trk();
      }
      if (b.dataset.done) { await api('/api/campaign-recipients/' + b.dataset.done + '/follow-up', { m: 'PUT', b: { done: 1 } }); return trk(); }
      if (b.dataset.reply) {
        const form = await showFormDialog('Mark replied', [
          { name: 'note', label: 'Reply note (optional)', type: 'text', value: '' }
        ]);
        if (!form) return;
        await api('/api/campaign-recipients/' + b.dataset.reply + '/reply', { b: { note: (form.note || '').trim() } });
        return trk();
      }
    } catch (err) { await showDialog('Could not update tracking', err.message); }
  };
  const body = $('#trk-body');
  if (!l.length) { body.innerHTML = '<tr><td colspan="6" class="empty">No sent emails yet.</td></tr>'; return; }
  const now = Date.now();
  for (const x of l) {
    const evs = await api(`/api/track/events/${x.id}`).catch(() => []);
    const events = evs.map(e => `<span class="tracking-badge track-${esc(e.event_type)}">${esc(e.event_type)}</span> <span class="small">${esc(String(e.event_at||'').replace('T',' ').slice(0,16))}</span>`).join('<br>') || '<span class="small">No events yet</span>';
    const replied = x.replied_at || evs.some(e => e.event_type === 'reply');
    const due = x.follow_up_at ? new Date(x.follow_up_at).getTime() : NaN;
    const follow = replied ? `<span class="badge ok">Replied</span>` : x.follow_up_done_at ? `<span class="badge follow-done">Done</span>` : x.follow_up_at ? `<span class="badge ${!Number.isNaN(due)&&due<now?'follow-overdue':'follow-due'}">${!Number.isNaN(due)&&due<now?'Overdue':'Due'} ${esc(x.follow_up_at.replace('T',' '))}</span>` : '<span class="badge">No follow-up</span>';
    body.innerHTML += `<tr>
      <td class="tracking-table">${esc(x.at)}
      <td class="tracking-table">${esc(x.to_list)}
      <td class="tracking-table">${esc(x.subject)}
      <td class="tracking-table">${events}
      <td class="tracking-table">${follow}${x.follow_up_note ? `<div class="small">${esc(x.follow_up_note)}</div>` : ''}
      <td class="tracking-table"><div class="follow-actions"><button class="secondary" data-follow="${x.id}" data-at="${esc(x.follow_up_at||'')}" data-note="${esc(x.follow_up_note||'')}">Set follow-up</button><button class="secondary" data-reply="${x.id}">Mark replied</button>${x.follow_up_at && !x.follow_up_done_at && !replied ? `<button data-done="${x.id}">Done</button>` : ''}</div>
    </tr>`;
  }
}

const V = { send, drafts, tpl, snd, recipients, usr, co, trk, log };
boot();
</script>
